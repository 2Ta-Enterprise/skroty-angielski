<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka Angielskiego</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Górny pasek opcji -->
        <header class="top-bar">
            <a href="index.html" class="back-btn">← Powrót</a>
            <div class="top-actions">
                <button class="icon-btn" onclick="toggleModal(true)">⚙️ Kategorie</button>
                <select id="motyw" onchange="zmienMotyw()">
                    <option value="Default" selected>Domyślny Ciemny</option>
                    <option value="Violet">Fioletowy Rozbłysk</option>
                    <option value="Pink">Różowy Akcent</option>
                    <option value="Blue">Głęboki Błękit</option>
                    <option value="Orange">Ciepła Pomarańcza</option>
                    <option value="Pony">Neonowy Fiolet</option>
                </select>
            </div>
        </header>

        <!-- Karta Główna (Fiszka) -->
        <main class="flashcard">
            <div class="card-header">
                <span class="quiz-badge" id="licznik-pojec">Dostępnych słówek: 0</span>
            </div>
            
            <div id="skrot">Wybierz kategorię</div>
            <div id="poprawnaOdpowiedz" style="display: none;"></div>
            
            <div class="quiz-form">
                <input type="text" id="odpowiedz" placeholder="Wpisz odpowiedź..." autocomplete="off">
                
                <div class="button-group">
                    <button id="sprawdzOdpowiedz" onclick="sprawdzOdpowiedz()">Sprawdź</button>
                    <button id="wylosujInnySkrot" onclick="losujInnySkrót()">Wylosuj inny</button>
                </div>
                
                <p id="wynik" style="display: none;"></p>
                <button id="pokazOdpowiedz" style="display: none;" onclick="pokazOdpowiedz()">Pokaż odpowiedź</button>
            </div>
        </main>
    </div>

    <!-- Modal Z Wyborem Kategorii -->
    <div class="modal-overlay" id="modal-categories">
        <div class="modal-window">
            <div class="modal-header">
                <span class="modal-title">Wybierz kategorie</span>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>
            
            <div class="modal-actions">
                <button class="btn-sm" onclick="zaznaczWszystkie(true)">Zaznacz wszystkie</button>
                <button class="btn-sm" onclick="zaznaczWszystkie(false)">Odznacz wszystkie</button>
            </div>

            <div class="categories-grid" id="kategorie-list">
                <label class="checkbox-item">
                    <input type="checkbox" value="29_10_tworcy_i_ich_dziela" onchange="zaktualizujKategorie()">
                    <span>29_10_tworcy_i_ich_dziela</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="29_10_uczestnictwo_w_kulturze" onchange="zaktualizujKategorie()">
                    <span>29_10_uczestnictwo_w_kulturze</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="29_10_tradycje_i_zwyczaje" onchange="zaktualizujKategorie()">
                    <span>29_10_tradycje_i_zwyczaje</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="20_10_media" onchange="zaktualizujKategorie()">
                    <span>20_10_media</span>
                </label>

            </div>

            <button onclick="toggleModal(false)" style="margin-top: 10px;">Zatwierdź i Ucz się</button>
        </div>
    </div>

    <footer class="footer">
        <b>Michał i Wojtek - 2Ta</b>
    </footer>

    <script src="script.js"></script>
</body>
</html>
